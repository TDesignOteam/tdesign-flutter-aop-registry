name: Test Examples Build

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-example:
    name: Build _example (Flutter < 3.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable

      - name: Clean Flutter SDK completely
        run: |
          cd $FLUTTER_ROOT
          echo "=== Full cleanup ==="
          git restore .
          git clean -fdx
          git reset --hard HEAD
          rm -rf bin/cache/ .dart_tool/ .packages pubspec.lock
          echo "=== Remove compiled files ==="
          find . -name "*.dart.snapshot" -delete 2>/dev/null || true
          find . -name "*.o" -delete 2>/dev/null || true
          echo "Cleanup completed"

      - name: Apply AOP Registry patch
        run: |
          cd $FLUTTER_ROOT
          PATCH_FILE=$GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch
          
          echo "=== Patch file diagnostics ==="
          ls -la $PATCH_FILE
          echo "File size: $(stat -f%z $PATCH_FILE 2>/dev/null || stat -c%s $PATCH_FILE 2>/dev/null) bytes"
          echo "Last 5 lines:"
          tail -5 $PATCH_FILE
          echo ""
          
          echo "=== Checking patch compatibility ==="
          git apply --check -p1 $PATCH_FILE 2>&1 | head -30 || (echo "Pre-check failed with exit code $?"; cat $PATCH_FILE | tail -100; exit 1)
          
          echo "=== Applying patch with -p1 ==="
          git apply -p1 $PATCH_FILE 2>&1 | head -20 || (echo "Patch apply failed with exit code $?"; exit 1)
          
          echo "=== Verify patched files exist ==="
          ls -la packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart
          
          echo "=== Verify _normalYaml function ==="
          grep -A 10 "dynamic _normalYaml" packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart | head -15
          
          echo "=== Verify file is not truncated ==="
          TOTAL_LINES=$(wc -l < packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart)
          echo "Total lines in pub_interceptor.dart: $TOTAL_LINES"
          if [ $TOTAL_LINES -lt 1000 ]; then
            echo "ERROR: File appears to be truncated! Expected > 1000 lines"
            tail -50 packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart
            exit 1
          fi
          echo "File integrity verified"

      - name: Build _example APK
        run: |
          cd _example
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/

