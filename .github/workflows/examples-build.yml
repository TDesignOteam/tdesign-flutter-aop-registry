name: Test Examples Build

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-example:
    name: Build _example (Flutter 2.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "8.0"

      - name: Set up Flutter
        uses: Luozf12345/workflows/actions/setup-flutter@main
        with:
          flutter-version: 2.10.5
          channel: stable

      - name: Build _example APK
        run: |
          cd _example
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/

  build-example2:
    name: Build _example2 (Flutter >= 3.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Set up Flutter
        uses: Luozf12345/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Build _example2 APK
        run: |
          cd _example2
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/
