name: Test Examples Build

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-example:
    name: Build _example (Flutter < 3.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable

      - name: Clean Flutter SDK completely
        run: |
          cd $FLUTTER_ROOT
          echo "=== Full cleanup ==="
          git restore .
          git clean -fdx
          git reset --hard HEAD
          rm -rf bin/cache/ .dart_tool/ .packages pubspec.lock
          echo "=== Remove compiled files ==="
          find . -name "*.dart.snapshot" -delete 2>/dev/null || true
          find . -name "*.o" -delete 2>/dev/null || true
          echo "Cleanup completed"

      - name: Apply AOP Registry patch
        run: |
          cd $FLUTTER_ROOT
          echo "=== Verifying patch format ==="
          file $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch
          echo "=== Checking patch compatibility ==="
          git apply --check -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch 2>&1 | head -20 || (echo "Pre-check failed"; cat $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch | tail -50)
          echo "=== Applying patch with -p1 ==="
          git apply -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch 2>&1 | head -20 || (echo "Patch apply failed"; exit 1)
          echo "AOP Registry patch applied successfully"
          echo "=== Verify patched files exist ==="
          ls -la packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart
          echo "=== Verify _normalYaml function ==="
          grep -A 10 "dynamic _normalYaml" packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart | head -15

      - name: Build _example APK
        run: |
          cd _example
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/

  build-example2:
    name: Build _example2 (Flutter >= 3.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Clean Flutter SDK completely
        run: |
          cd $FLUTTER_ROOT
          echo "=== Full cleanup ==="
          git restore .
          git clean -fdx
          git reset --hard HEAD
          rm -rf bin/cache/ .dart_tool/ .packages pubspec.lock
          echo "=== Remove compiled files ==="
          find . -name "*.dart.snapshot" -delete 2>/dev/null || true
          find . -name "*.o" -delete 2>/dev/null || true
          echo "Cleanup completed"

      - name: Apply AOP Registry patch
        run: |
          cd $FLUTTER_ROOT
          echo "=== Verifying patch format ==="
          file $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch
          echo "=== Checking patch compatibility ==="
          git apply --check -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch 2>&1 | head -20 || (echo "Pre-check failed"; cat $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch | tail -50)
          echo "=== Applying patch with -p1 ==="
          git apply -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch 2>&1 | head -20 || (echo "Patch apply failed"; exit 1)
          echo "AOP Registry patch applied successfully"
          echo "=== Verify patched files exist ==="
          ls -la packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart
          echo "=== Verify _normalYaml function ==="
          grep -A 10 "dynamic _normalYaml" packages/flutter_tools/lib/src/aop_tools/interceptor/impl/pub_interceptor.dart | head -15

      - name: Build _example2 APK
        run: |
          cd _example2
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/
