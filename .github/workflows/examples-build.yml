name: Test Examples Build

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-example:
    name: Build _example (Flutter < 3.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable

      - name: Apply AOP Registry patch
        run: |
          cd $FLUTTER_ROOT
          git restore .
          git clean -fd
          rm -rf bin/cache/
          echo "=== Checking patch compatibility ==="
          git apply --check -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch 2>&1 | head -100 || true
          echo "=== Applying patch with -p1 ==="
          git apply -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch
          echo "AOP Registry patch applied"

      - name: Build _example APK
        run: |
          cd _example
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/

  build-example2:
    name: Build _example2 (Flutter >= 3.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Apply AOP Registry patch
        run: |
          cd $FLUTTER_ROOT
          git restore .
          git clean -fd
          rm -rf bin/cache/
          echo "=== Checking patch compatibility ==="
          git apply --check -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch 2>&1 | head -100 || true
          echo "=== Applying patch with -p1 ==="
          git apply -p1 $GITHUB_WORKSPACE/patch_flutter/3.24~3.32.patch
          echo "AOP Registry patch applied"

      - name: Build _example2 APK
        run: |
          cd _example2
          flutter doctor -v
          flutter pub get --verbose
          flutter build apk --debug
          echo "=== Build successful ==="
          ls -la build/app/outputs/flutter-apk/
